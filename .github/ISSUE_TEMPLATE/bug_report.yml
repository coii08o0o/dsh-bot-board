name: Bug report / 问题反馈
description: The board is missing, shows the wrong thing, or takes the page down with it. / 看板不见了、显示不对，或者把页面带崩了。
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        The board is a read-only view of DS Bot's own state, so most reports come down to
        one of three things: it did not load, it loaded and read the wrong field, or it
        crashed. The first answer below separates them faster than anything else.

        看板是 DS Bot 状态的一份只读视图，问题基本落在三种里：没加载起来、加载了但读错了字段、
        崩了。下面第一项能把这三者分开，比什么都快。

  - type: dropdown
    id: symptom
    attributes:
      label: What does it look like / 现在是什么样
      description: Pick the closest one. "Only a pill" means the error boundary caught a render failure and the panel is unmounted. / 选最接近的一项。「只剩一颗胶囊」意味着渲染出错、整块面板被错误边界卸载了。
      options:
        - The board is not on screen at all / 看板完全不见了
        - Only a small pill, no panel / 只剩一颗小胶囊，没有面板
        - The panel is there but a count or a state is wrong / 面板在，但某个数字或状态不对
        - The panel is there but empty, or stuck on loading / 面板在，但是空的，或者一直「载入中」
        - The page crashed or froze / 页面崩了或卡住了
        - Something else / 其他
    validations:
      required: true

  - type: input
    id: board-version
    attributes:
      label: dsh-bot-board version / 看板版本
      description: The npm badge on the README, or `npm ls dsh-bot-board` in your DSH profile. / README 上的 npm 徽章，或者 profile 里跑 `npm ls dsh-bot-board`。
      placeholder: 0.7.3
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version / DSH 版本
      description: Shown in DSH's own About or update panel. / 在 DSH 的「关于」或更新面板里能看到。
      placeholder: 0.2.1-rc.2
    validations:
      required: true

  - type: input
    id: dsbot-version
    attributes:
      label: ds-bot version / DS Bot 版本
      description: |
        Optional, but it is the most common cause of a board that renders and reads the wrong
        field — the README's own advice is to send it. / 可选，但「能显示、字段读错」最常见的原因
        就是它变了——README 里也是这么建议的。
      placeholder: 0.2.0
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Platform / 平台
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to get there / 怎么复现
      description: What you clicked or what was running when it happened. If it happens on every start, say so — that is a different bug from one that needs a click. / 你点了什么、当时在跑什么。如果每次打开都这样，也请写明——那和「要操作才出现」是两种问题。
      placeholder: |
        1. Opened DSH with 9 Bots, two of them running
        2. Collapsed the board, then expanded it
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected / 你期望看到什么
      description: Optional, but it is the only way to tell a wrong number from a differently-worded right one. / 可选，但这是区分「数字错了」和「数字对、只是说法不同」的唯一办法。
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console error / 控制台报错
      description: |
        Optional. If you can open the browser console (in DSH: View → Toggle Developer Tools, or Cmd/Ctrl+Shift+I),
        paste the line that starts with `[bot-board]` — it names the component that threw.
        / 可选。能打开控制台的话（DSH 里：视图 → 开发者工具，或 Cmd/Ctrl+Shift+I），
        把以 `[bot-board]` 开头的那一行贴上来，它会指出是哪个组件抛的错。
      render: text
    validations:
      required: false

  - type: textarea
    id: roster
    attributes:
      label: What the team looked like / 当时团队是什么状态
      description: Roughly how many Bots, and whether any was running, waiting or failed. Names and session ids are not needed. / 大概几个 Bot，有没有在跑、在等、报错的。不需要名字和 session id。
      placeholder: 9 Bots, 2 running, 1 waiting for an approval
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post / 提交前
      options:
        - label: I did not paste the contents of `state.json`, an API key, or a session id. / 我没有贴 `state.json` 的内容、密钥或 session id。
          required: true
